<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082033">
<title>AquaLogic Beta 10.2 — Adaptive Layout</title>
<style>
:root{
  --navy:#082033; --navy2:#0d2c43; --blue:#22a6f2; --green:#2fbf71; --amber:#efb949; --red:#dd5d5d;
  --bg:#edf3f7; --card:#ffffff; --text:#133144; --muted:#5f7586; --line:#d7e3eb; --shadow:0 10px 30px rgba(8,32,51,.08);
  --radius:22px; --radius2:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
img{max-width:100%;display:block}
a{color:inherit}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy),#0b2740);color:#eaf5fb;padding:18px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand img{width:52px;height:52px;border-radius:12px;object-fit:cover}
.brand h1{font-size:1.15rem;line-height:1.1;margin:0;font-weight:800}
.brand small{display:block;opacity:.8;font-size:.83rem;margin-top:4px}
.site-picker{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px}
.site-picker label{display:block;font-size:.83rem;margin-bottom:8px;color:#b9d9ea}
.site-picker select{width:100%;padding:12px 14px;border-radius:14px;border:none;background:#f5fbff;color:#163142;font-weight:700}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{border:none;background:transparent;color:#d7edf9;padding:14px 16px;border-radius:16px;text-align:left;font-weight:700;display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .16s ease,background .16s ease,color .16s ease}
.nav button:hover,.nav button:focus-visible{background:rgba(255,255,255,.08);outline:none;transform:translateX(2px)}
.nav button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.nav .icon{width:24px;text-align:center;font-size:1.18rem}
.quick-tip{margin-top:auto;background:rgba(255,255,255,.08);border-radius:18px;padding:14px;border:1px solid rgba(255,255,255,.06)}
.quick-tip h3{margin:0 0 6px;font-size:.95rem}
.quick-tip p{margin:0;color:#cbe7f6;font-size:.88rem;line-height:1.45}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(237,243,247,.88);backdrop-filter:blur(10px);padding:14px 18px;border-bottom:1px solid #dce7ee;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.menu-btn{display:none;border:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;box-shadow:var(--shadow)}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:0 14px;box-shadow:var(--shadow)}
.search input{flex:1;border:none;background:transparent;padding:15px 0;color:var(--text);font-weight:600}
.search input:focus{outline:none}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}
.pill{border:none;background:#fff;border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:16px;font-weight:800;box-shadow:var(--shadow);cursor:pointer}
.pill.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.content{padding:20px;display:grid;gap:18px;animation:fade .28s ease}
@keyframes fade{from{opacity:.32;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 10px}
.muted{color:var(--muted)}
.big{font-size:1.85rem;font-weight:900;letter-spacing:-.03em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.kpi .label{font-size:.82rem;color:var(--muted);font-weight:700;margin-bottom:8px}
.kpi .value{font-size:1.5rem;font-weight:900}
.status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.status{padding:16px;border-radius:18px;color:#fff;display:flex;flex-direction:column;gap:8px;min-height:118px}
.status.blue{background:linear-gradient(135deg,#0b2a43,#1579ba)}
.status.green{background:linear-gradient(135deg,#0f4f39,#2fbf71)}
.status.amber{background:linear-gradient(135deg,#7b5307,#efb949)}
.status .small{opacity:.82;font-weight:700}
.action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.action-btn{border:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 18px;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .16s ease, box-shadow .16s ease}
.action-btn:hover,.action-btn:focus-visible{transform:translateY(-2px);outline:none;box-shadow:0 16px 32px rgba(8,32,51,.12)}
.action-btn .emoji{font-size:1.6rem}
.action-btn .title{font-weight:900;font-size:1rem}
.action-btn .desc{font-size:.9rem;color:var(--muted);line-height:1.4}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.list{display:grid;gap:12px}
.zone{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:1.2fr .9fr .9fr .9fr auto;gap:12px;align-items:center;cursor:pointer;transition:transform .15s ease,border-color .15s ease}
.zone:hover{transform:translateY(-1px);border-color:#b7d2e1}
.zone-title{font-weight:900}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;font-size:.82rem;font-weight:800}
.badge.green{background:#e7f8ef;color:#11673d}.badge.red{background:#fdeaea;color:#892a2a}.badge.blue{background:#e8f4fd;color:#0d5f93}.badge.amber{background:#fff4dc;color:#855600}.badge.gray{background:#edf3f7;color:#527083}
.progress{height:10px;background:#edf3f7;border-radius:999px;overflow:hidden}.progress > span{display:block;height:100%;background:linear-gradient(90deg,#22a6f2,#2fbf71);border-radius:999px}
.mini-map{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.plot-card{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}
.field-visual{height:90px;border-radius:16px;background:linear-gradient(180deg,#d6efcf,#b6e2a8);position:relative;overflow:hidden;border:1px solid #cae3c2}
.field-visual:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(34,166,242,.12),rgba(34,166,242,.12) 3px, transparent 3px, transparent 36px)}
.field-visual:after{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.75)}
.empty{padding:24px;border:2px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
label span{display:block;font-size:.85rem;font-weight:800;color:var(--muted);margin-bottom:8px}
input,select,textarea{width:100%;padding:14px 15px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(34,166,242,.2);border-color:#74bde6}
textarea{min-height:100px;resize:vertical}
.form-actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.button{border:none;border-radius:16px;padding:13px 18px;font-weight:900;cursor:pointer}
.button.primary{background:var(--navy);color:#fff}.button.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.button.green{background:var(--green);color:#fff}.button.red{background:var(--red);color:#fff}.button.amber{background:var(--amber);color:#25364a}
.weather-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.weather-card{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff;text-align:center}
.issue{display:grid;grid-template-columns:1.4fr 1fr auto;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:20px;background:#fff}
.solution-box{border:1px solid #dce8ee;border-radius:18px;padding:16px;background:#f8fcfe}
.search-results{display:grid;gap:10px;margin-top:10px}
.search-item{padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer}
.search-item:hover{border-color:#a8c7da}
.helper-band{display:flex;gap:14px;align-items:flex-start;background:#eef8ff;border:1px solid #d4e8f5;color:#18445e;padding:15px;border-radius:18px}
.helper-band strong{display:block;margin-bottom:3px}
.tutorial-steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);padding:16px;border-radius:18px;background:#fff}
.step-no{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900}
.hint{font-size:.9rem;color:var(--muted)}
footer{color:var(--muted);font-size:.86rem;padding:8px 2px}
.toast{position:fixed;right:18px;bottom:18px;max-width:360px;background:#12344c;color:#fff;padding:14px 16px;border-radius:16px;box-shadow:0 16px 34px rgba(0,0,0,.18);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s ease;z-index:12}
.toast.show{opacity:1;transform:none}
.overlay{position:fixed;inset:0;background:rgba(4,16,26,.52);z-index:30;pointer-events:none;display:grid;place-items:center;padding:18px}
.panel{pointer-events:auto;width:min(720px,100%);background:#fff;border-radius:28px;border:1px solid var(--line);box-shadow:0 24px 48px rgba(0,0,0,.2);padding:20px;animation:fade .22s ease}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.panel header h3{margin:0}
.x{border:none;background:#edf3f7;border-radius:12px;padding:8px 11px;font-weight:900;cursor:pointer}
.tour-highlight{box-shadow:0 0 0 4px rgba(34,166,242,.34),0 10px 30px rgba(34,166,242,.25)!important;position:relative;z-index:21;border-radius:18px;transition:box-shadow .18s ease}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (max-width:1180px){.hero,.grid-2,.kpis,.action-grid,.status-row,.weather-row,.grid-4{grid-template-columns:repeat(2,1fr)}.zone{grid-template-columns:1fr 1fr 1fr;align-items:flex-start}.zone>div:nth-child(4),.zone>div:nth-child(5){grid-column:span 1}.grid-3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);transform:translateX(-100%);transition:.22s ease;z-index:15;height:auto}.sidebar.open{transform:none}.menu-btn{display:inline-flex}.topbar{padding:14px}.content{padding:14px}.hero,.grid-2,.grid-3,.grid-4,.action-grid,.status-row,.weather-row,.form-grid,.kpis{grid-template-columns:1fr}.zone{grid-template-columns:1fr}.issue,.step{grid-template-columns:1fr}.top-actions{width:100%}.top-actions .pill{flex:1}}

/* GPS-equipped asset locator: small maps, large targets and offline-readable site plans */
.map-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(310px,.85fr);gap:16px;align-items:start}
.map-card{overflow:hidden}
.map-stage{position:relative;min-height:420px;height:min(57vh,570px);background:linear-gradient(160deg,#d9ecdd,#eff2e4 62%,#e0efe0);border:2px solid #c7dacf;border-radius:20px;overflow:hidden}
.map-stage:before{content:"";position:absolute;inset:0;opacity:.52;background:repeating-linear-gradient(0deg,transparent,transparent 42px,rgba(20,96,68,.08) 43px),repeating-linear-gradient(90deg,transparent,transparent 42px,rgba(20,96,68,.08) 43px)}
.map-road{position:absolute;background:#f8f2e1;border:2px solid rgba(153,141,102,.24);transform:rotate(-16deg);height:24px;width:130%;left:-12%;top:56%;border-radius:18px}
.map-road.north{top:10%;transform:rotate(6deg);height:18px}
.map-compass{position:absolute;top:12px;right:12px;border-radius:14px;background:rgba(255,255,255,.96);padding:8px 11px;font-size:.82rem;font-weight:900;z-index:2}
.map-caption{position:absolute;left:12px;bottom:10px;max-width:90%;background:rgba(255,255,255,.96);border-radius:12px;padding:8px 10px;font-size:.78rem;color:#365d4f;z-index:2}
.map-pin{position:absolute;z-index:3;transform:translate(-50%,-50%);min-width:45px;min-height:45px;padding:7px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;background:#11374c;color:#fff;box-shadow:0 4px 10px rgba(3,25,39,.35);font-size:1.2rem;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}
.map-pin:hover,.map-pin:focus-visible{transform:translate(-50%,-50%) scale(1.1);box-shadow:0 0 0 4px rgba(34,166,242,.25);outline:none}
.map-pin.warn{background:#a75813}.map-pin.critical{background:#c13d3d}.map-pin.selected{box-shadow:0 0 0 5px #21a6f4,0 8px 16px rgba(0,0,0,.32);transform:translate(-50%,-50%) scale(1.1)}
.map-pin-label{opacity:0;visibility:hidden;transition:opacity .12s ease;position:absolute;pointer-events:none;font-size:.69rem;font-weight:800;white-space:nowrap;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(255,255,255,.94);color:#11374c;padding:3px 6px;border-radius:8px;border:1px solid #c6d9d0;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.map-pin.selected .map-pin-label,.map-pin:hover .map-pin-label,.map-pin:focus-visible .map-pin-label{opacity:1;visibility:visible}
.map-legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.legend-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;background:#11374c}
.legend-dot.warn{background:#a75813}.legend-dot.critical{background:#c13d3d}
.map-note{padding:12px;border-radius:16px;background:#eaf5fc;color:#30536d;font-size:.88rem;line-height:1.5}
.device-list{display:grid;gap:8px;max-height:560px;overflow:auto}
.device-row{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;cursor:pointer;min-height:52px}
.device-row.active{border:2px solid #0d7dbd;background:#edf8ff}
.device-row .symbol{font-size:1.24rem;min-width:29px}
.device-row .info{flex:1;min-width:0}
.device-row .info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.device-row .info small{color:var(--muted)}
.device-card p{margin:7px 0}
.device-card .coords{font-variant-numeric:tabular-nums;word-break:break-all;background:#edf4f8;border-radius:10px;padding:10px;font-size:.86rem}
.device-card .actions{display:flex;flex-wrap:wrap;gap:8px}
.device-card .actions button,.device-card .actions a{flex:1;min-width:150px;text-decoration:none;text-align:center}
.device-card .button{min-height:48px;display:inline-flex;align-items:center;justify-content:center}
.map-subnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.map-subnav .pill.active{background:#0e3450;color:#fff}
.gps-setup{background:#f6fbfd;border:1px solid #cfe0e9;border-radius:14px;padding:12px;margin-top:12px}
.gps-setup label{display:block;margin:8px 0}
.gps-setup input{margin-top:6px}
.locator-meta{font-size:.83rem;color:var(--muted)}
.info-inline{display:inline-flex;gap:6px;align-items:center}
@media (max-width:1220px){.map-layout{grid-template-columns:1fr}.device-list{max-height:340px}}
@media (max-width:860px){.map-stage{height:390px;min-height:390px}.map-pin-label{display:none}.map-pin.selected .map-pin-label{display:block}.device-card .actions button,.device-card .actions a{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){.map-pin,.map-stage *{transition:none!important;animation:none!important}}

/* Beta 8: accessible inline details, stable live search, non-overlay tutorial */
[hidden]{display:none!important}
.workspace{display:grid;grid-template-columns:minmax(0,1fr);align-items:start;min-width:0}
.workspace.tour-open{grid-template-columns:minmax(0,1fr) 340px;column-gap:0}
.workspace>.content{min-width:0}
.tour-rail{position:sticky;top:91px;align-self:start;margin:18px 18px 0 0;max-height:calc(100vh - 110px);overflow:auto;border:2px solid #bed9e8;border-radius:22px;background:#fff;box-shadow:var(--shadow);padding:20px;z-index:2}
.tour-rail h2{margin:6px 0 12px;font-size:1.22rem}
.tour-rail .tour-progress{height:8px;background:#e4eef4;border-radius:8px;overflow:hidden;margin:14px 0 18px}
.tour-rail .tour-progress span{display:block;height:100%;background:#1689c7;border-radius:8px;transition:width .18s ease}
.tour-rail p{line-height:1.6}
.tour-rail .tour-note{background:#edf7fb;border:1px solid #d2e5f0;padding:12px;border-radius:14px;font-size:.9rem;margin:14px 0}
.tour-rail .tour-nav{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tour-rail .tour-nav button{flex:1;min-width:88px}
.tour-mini{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0}
.tour-mini i{width:11px;height:11px;border-radius:50%;background:#c8dce7}
.tour-mini i.current{background:#047dc4;width:23px;border-radius:6px}
.tour-mini i.done{background:#36a66b}
.tour-highlight{outline:3px solid #1797df;outline-offset:4px;box-shadow:0 0 0 7px rgba(24,143,204,.12)!important;z-index:auto;position:relative}
.search-item{display:block;width:100%;font-weight:500;text-align:left;color:var(--text)}
.search-item strong{font-weight:850}
.search-results{max-height:360px;overflow-y:auto}
.search-results:empty{display:none}
.inline-detail{background:#f1f8fc;border:1px solid #cddfea;border-radius:15px;padding:13px;margin:8px 0 12px;line-height:1.55}
.inline-detail p{margin:7px 0}
.zone-click{width:100%;text-align:left;font:inherit;color:inherit}
.zone-click:hover,.plot-interactive:hover,.kpi[role="button"]:hover{border-color:#85b5d0;box-shadow:0 5px 14px rgba(8,32,51,.08)}
.zone-click:focus-visible,.plot-interactive:focus-visible,.kpi[role="button"]:focus-visible{outline:3px solid #178bd0;outline-offset:2px}
.plot-interactive{width:100%;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi[role="button"]{cursor:pointer;text-align:left}
.expand-note{font-size:.78rem;color:#4f7085;margin-top:8px;font-weight:750}
.issue-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:13px}
.issue-card h3{margin:0}
.issue-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.issue-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.issue-card .solution-box{min-width:0;white-space:normal}
.plan-text{white-space:pre-line;color:#264559;line-height:1.65;font-size:.94rem;margin:10px 0}
.plan-editor textarea{width:100%;resize:vertical;min-height:155px;line-height:1.45}
.plan-buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.plan-buttons button{min-height:47px}
.task-record{border-radius:14px;background:#eff8ef;border:1px solid #c9e6ce;padding:12px;margin-top:12px;color:#214b38;font-size:.92rem}
.small-label{font-size:.8rem;color:#5e788c;font-weight:750}
.info-button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:#123a53;font-weight:800;cursor:pointer}
@media(max-width:1500px){.workspace.tour-open{grid-template-columns:minmax(0,1fr) 315px}.workspace.tour-open .hero,.workspace.tour-open .grid-2,.workspace.tour-open .kpis,.workspace.tour-open .status-row,.workspace.tour-open .action-grid,.workspace.tour-open .weather-row,.workspace.tour-open .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace.tour-open .map-layout{grid-template-columns:1fr}.workspace.tour-open .zone{grid-template-columns:1fr 1fr}}
@media(max-width:1120px){.workspace.tour-open{grid-template-columns:1fr}.tour-rail{grid-row:1;position:static;margin:14px 14px 0;max-height:none}.workspace.tour-open .content{grid-row:2}.workspace.tour-open .issue-grid{grid-template-columns:1fr}}
@media(max-width:860px){.issue-grid{grid-template-columns:1fr}.tour-rail{padding:16px}.zone-click{display:grid;grid-template-columns:1fr}}
@media(max-width:860px){
 .workspace.tour-open .hero,.workspace.tour-open .grid-2,.workspace.tour-open .kpis,
 .workspace.tour-open .status-row,.workspace.tour-open .action-grid,.workspace.tour-open .weather-row,
 .workspace.tour-open .grid-3,.workspace.tour-open .zone{grid-template-columns:minmax(0,1fr)}
 .workspace.tour-open .card{min-width:0}
}
@media(prefers-reduced-motion:reduce){.tour-rail .tour-progress span{transition:none}}

/* Beta 8.1: compact, sunlight-readable 7-day weather view */

.aqua-map-viewport svg .aqua-pin{cursor:pointer;outline:none}
.aqua-map-viewport svg .aqua-pin .pin-circle{fill:#0e4a65;stroke:white;stroke-width:4;transition:fill .18s,stroke-width .18s}
.aqua-map-viewport svg .aqua-pin.warn .pin-circle{fill:#c37c14}.aqua-map-viewport svg .aqua-pin.critical .pin-circle{fill:#c9343b}

 if(!Array.isArray(si.plots))si.plots=[];
 if(!Array.isArray(si.zones))si.zones=[];
 const groups=new Map();
 for(const plot of si.plots){
  if(!si.zones.some(z=>z.id===plot.zoneId))plot.zoneId='';
  const key=plot.zoneId||'__unassigned';
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(plot);
 }
 for(const [key,plots] of groups){
  plots.forEach((plot,index)=>{
   const m=plot.map;
   if(!m||!['u','v','w','h'].every(k=>Number.isFinite(Number(m[k]))))plot.map=mapSlot(index,plots.length);
   else plot.map={u:Math.max(.01,Math.min(.95,Number(m.u))),v:Math.max(.02,Math.min(.94,Number(m.v))),w:Math.max(.12,Math.min(.88,Number(m.w))),h:Math.max(.075,Math.min(.75,Number(m.h)))};
  });
 }
}
function mapLayout(si){
 const plots=si.plots||[],zones=si.zones||[],regions=[];
 const all=zones.map(z=>({...z,unassigned:false}));
 if(plots.some(p=>!p.zoneId))all.push({id:'__unassigned',name:'Unassigned plots',crop:'Assign a zone when ready',unassigned:true,moisture:0});
 const rows=Math.ceil(all.length/2), heights=[];
 for(let r=0;r<rows;r++){
  const counts=all.slice(r*2,r*2+2).map(z=>plots.filter(p=>(p.zoneId||'__unassigned')===z.id).length);
  heights.push(Math.max(240,118+Math.ceil(Math.max(1,...counts)/2)*76));
 }
 let y=82;
 for(let r=0;r<rows;r++){
  for(let col=0;col<2;col++){
   const z=all[r*2+col];if(!z)continue;
   regions.push({id:z.id,name:z.name,crop:z.crop,unassigned:z.unassigned,moisture:z.moisture,x:col?525:82,y,w:392,h:heights[r]});
  }
  y+=heights[r]+42;
 }
 return {regions,height:Math.max(650,y+25)};
}
function plotPosition(plot,layout){
 const region=layout.regions.find(z=>z.id===(plot.zoneId||'__unassigned'));
 if(!region)return null;
 const m=plot.map||mapSlot(0,1),w=Math.min(region.w*.89,region.w*m.w),h=Math.min(region.h*.63,region.h*m.h);
 const x=region.x+Math.max(8,Math.min(region.w-w-8,Number(m.u)*region.w));
 const y=region.y+Math.max(78,Math.min(region.h-h-9,Number(m.v)*region.h));
 return {x,y,w,h,region};
}

function load(){

       const example=seeded.sites.find(x=>x.id===si.id);
       if(!Array.isArray(si.devices)) si.devices=example?structuredClone(example.devices):[];
       if(Array.isArray(si.plots)) for(const p of si.plots){if(Number(p.area)>100) p.area=Number(p.area)/10000;}
       preparePlotPositions(si);
       if(!Array.isArray(si.manualSchedules)) si.manualSchedules=[];
       if(Array.isArray(si.issues)) for(const i of si.issues){if(!i.deviceId && example){const match=example.issues.find(x=>x.id===i.id); if(match) i.deviceId=match.deviceId;}}
     }
     return obj;
   }
 }catch(e){}

 for(const si of initial.sites){preparePlotPositions(si);si.manualSchedules=[];}

}

function forecastGuidance(days){

 if(rain)return `Rain may arrive ${weekDayLabel(rain.date,days.indexOf(rain))}. Check measured soil moisture before extra irrigation; do not skip critical watering solely because rain is forecast.`;
 if(heat)return `Hot conditions forecast ${weekDayLabel(heat.date,days.indexOf(heat))}. Monitor soil moisture closely and check approved watering limits.`;
 if(wind)return `Windy conditions forecast ${weekDayLabel(wind.date,days.indexOf(wind))}. Avoid unnecessary sprinkler drift where possible.`;
 return 'No major weather flag from this forecast. Base watering decisions on measured soil conditions and approved crop requirements.';
}

 <g transform="translate(957,40)"><path d="M0 -17L11 17L0 8L-11 17Z" fill="#1e5e75"/><text y="37" text-anchor="middle" font-size="16" fill="#2b5870">N</text></g>

function cameraFor(){return mapCameras[site().id]||(mapCameras[site().id]={scale:1,x:0,y:0})}
function updateCamera(){for(const el of document.querySelectorAll('[data-map-world]')){const cam=cameraFor();el.style.transform=`translate3d(${cam.x}px,${cam.y}px,0) scale(${cam.scale})`;}}
function adjustCamera(action){const c=cameraFor();if(action==='reset'){c.x=0;c.y=0;c.scale=1;}else{const next=Math.min(3.4,Math.max(1,c.scale*(action==='zoom-in'?1.28:1/1.28)));c.scale=next;c.x=Math.min(480,Math.max(-480,c.x));c.y=Math.min(320,Math.max(-320,c.y));}updateCamera();}
function setupMapInteractions(){
 updateCamera();
 document.querySelectorAll('[data-camera]').forEach(btn=>btn.onclick=()=>adjustCamera(btn.dataset.camera));
 document.querySelectorAll('[data-map-viewport]').forEach(view=>{
  view.classList.toggle('editing-plots',mapEditMode&&state.route==='equipment');
  const points=new Map();let moved=false, startDist=0,startZoom=1,lastCenter=null,dragPlot=null,ignoreClickBefore=0;
  const svg=view.querySelector('svg');
  const svgPt=(clientX,clientY)=>{const pt=svg.createSVGPoint();pt.x=clientX;pt.y=clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())};
  const targetAt=el=>{
   const plot=el.closest('[data-plot-map]'),device=el.closest('[data-device-map]'),zone=el.closest('[data-zone-map]');
   return plot?{kind:'plot',id:plot.dataset.plotMap}:device?{kind:'device',id:device.dataset.deviceMap}:zone?{kind:'zone',id:zone.dataset.zoneMap}:null;
  };
  const activate=target=>{
   if(!target)return;
   if(target.kind==='plot'){selectPlotOnMap(target.id);return;}
   if(target.kind==='device'){selectDevice(target.id);return;}
   if(target.kind==='zone'){
    if(target.id==='__unassigned'){state.route='equipment';render();return;}
    state.route='zones';expandedCard='zone:'+target.id;state.search='';save();render();
   }
  };
  view.addEventListener('wheel',ev=>{
   ev.preventDefault();const c=cameraFor(),old=c.scale,rect=view.getBoundingClientRect();
   const x=ev.clientX-rect.left-rect.width/2,y=ev.clientY-rect.top-rect.height/2;
   c.scale=Math.max(1,Math.min(4.5,c.scale*(ev.deltaY<0?1.13:1/1.13)));
   const ratio=c.scale/old;c.x=x-(x-c.x)*ratio;c.y=y-(y-c.y)*ratio;updateCamera();
  },{passive:false});
  view.addEventListener('pointerdown',ev=>{
   if(ev.button!==0&&ev.pointerType==='mouse')return;
   const target=targetAt(ev.target);
   // In positioning mode, dragging plots is separate from panning the entire map.
   if(mapEditMode&&state.route==='equipment'&&target?.kind==='plot'){
    const plot=site().plots.find(p=>p.id===target.id),position=plot&&plotPosition(plot,mapLayout(site()));
    if(!position)return;
    const pos=svgPt(ev.clientX,ev.clientY),g=ev.target.closest('[data-plot-map]');
    dragPlot={id:target.id,pointerId:ev.pointerId,start:pos,position,g,dx:0,dy:0,moved:false};
    view.setPointerCapture(ev.pointerId);ev.preventDefault();return;
   }
   view.setPointerCapture(ev.pointerId);
   points.set(ev.pointerId,{x:ev.clientX,y:ev.clientY,startX:ev.clientX,startY:ev.clientY,target});
   if(points.size===2){const a=[...points.values()];startDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startZoom=cameraFor().scale;lastCenter={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};moved=true;}
  });
  view.addEventListener('pointermove',ev=>{
   if(dragPlot&&dragPlot.pointerId===ev.pointerId){
    const pt=svgPt(ev.clientX,ev.clientY);dragPlot.dx=pt.x-dragPlot.start.x;dragPlot.dy=pt.y-dragPlot.start.y;
    if(Math.hypot(dragPlot.dx,dragPlot.dy)>5)dragPlot.moved=true;
    if(dragPlot.moved){dragPlot.g.setAttribute('transform',`translate(${dragPlot.dx} ${dragPlot.dy})`);view.classList.add('is-panning');}
    return;
   }
   if(!points.has(ev.pointerId))return;
   const prev=points.get(ev.pointerId);
   points.set(ev.pointerId,{...prev,x:ev.clientX,y:ev.clientY});
   const a=[...points.values()],c=cameraFor();
   if(a.length===1){
    if(Math.hypot(ev.clientX-prev.startX,ev.clientY-prev.startY)>7)moved=true;
    if(moved){c.x=Math.max(-900,Math.min(900,c.x+ev.clientX-prev.x));c.y=Math.max(-820,Math.min(820,c.y+ev.clientY-prev.y));}
   }else if(a.length===2){
    const center={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    const next=Math.max(1,Math.min(4.5,startZoom*(dist/Math.max(1,startDist))));
    const ratio=next/c.scale,cx=center.x-view.clientWidth/2,cy=center.y-view.clientHeight/2;
    c.x=cx-(cx-c.x)*ratio+(lastCenter?center.x-lastCenter.x:0);
    c.y=cy-(cy-c.y)*ratio+(lastCenter?center.y-lastCenter.y:0);
    c.scale=next;lastCenter=center;moved=true;
   }
   view.classList.toggle('is-panning',moved);updateCamera();
  });
  const finish=ev=>{
   if(dragPlot&&dragPlot.pointerId===ev.pointerId){
    const d=dragPlot;dragPlot=null;view.classList.remove('is-panning');
    if(ev.type==='pointercancel'){d.g.removeAttribute('transform');return;}
    if(!d.moved){ignoreClickBefore=performance.now()+450;activate({kind:'plot',id:d.id});return;}
    const plot=site().plots.find(p=>p.id===d.id);
    if(!plot)return;
    const x=d.position.x+d.dx,y=d.position.y+d.dy,cx=x+d.position.w/2,cy=y+d.position.h/2;
    const regions=mapLayout(site()).regions;
    // Change the linked zone if the plot is dropped over another zone.
    const dest=regions.find(r=>cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h)||d.position.region;
    if(dest){
     plot.zoneId=dest.unassigned?'':dest.id;
     const w=Math.min(.8,d.position.w/dest.w),h=Math.min(.65,d.position.h/dest.h);
     plot.map={u:Math.max(.02,Math.min(.96-w,(x-dest.x)/dest.w)),v:Math.max(.30,Math.min(.97-h,(y-dest.y)/dest.h)),w,h};
     preparePlotPositions(site());selectedPlot=plot.id;selectedDevice='';
     save();render();showToast(`Plot location saved${dest.unassigned?' as unassigned':' in '+dest.name}.`);
    }
    ignoreClickBefore=performance.now()+450;return;
   }
   const old=points.get(ev.pointerId),tap=ev.type==='pointerup'&&points.size===1&&!moved?old?.target:null;
   points.delete(ev.pointerId);if(points.size<2)lastCenter=null;
   if(!points.size)view.classList.remove('is-panning');
   if(tap){ignoreClickBefore=performance.now()+450;activate(tap);return;}
   if(!points.size){ignoreClickBefore=performance.now()+450;moved=false;}
  };
  view.addEventListener('pointerup',finish);view.addEventListener('pointercancel',finish);
  view.addEventListener('click',ev=>{if(performance.now()<ignoreClickBefore)return;activate(targetAt(ev.target));});
  view.addEventListener('keydown',ev=>{
   const c=cameraFor();
   if((ev.key==='Enter'||ev.key===' ')&&ev.target!==view){ev.preventDefault();activate(targetAt(ev.target));return;}
   if(ev.key==='+'||ev.key==='='){adjustCamera('zoom-in');ev.preventDefault();}
   if(ev.key==='-'){adjustCamera('zoom-out');ev.preventDefault();}
   if(ev.key==='0'){adjustCamera('reset');ev.preventDefault();}
   if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key)){
    c.x+=ev.key==='ArrowRight'?-28:ev.key==='ArrowLeft'?28:0;
    c.y+=ev.key==='ArrowDown'?-28:ev.key==='ArrowUp'?28:0;
    updateCamera();ev.preventDefault();
   }
  });
 });
}

function mapPointBounds(devices){
 const lat=devices.map(d=>Number(d.lat)).filter(Number.isFinite),lon=devices.map(d=>Number(d.lon)).filter(Number.isFinite);
 const loLat=Math.min(...lat), hiLat=Math.max(...lat),loLon=Math.min(...lon),hiLon=Math.max(...lon);
 return {loLat,hiLat,loLon,hiLon};
}
function mapPct(d,b){const dx=(Number(d.lon)-b.loLon)/(b.hiLon-b.loLon||.0001),dy=(Number(d.lat)-b.loLat)/(b.hiLat-b.loLat||.0001);return{x:12+76*dx,y:12+76*(1-dy)}}
function streetLocationUrl(d){const lat=Number(d.lat),lon=Number(d.lon);return Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180?`https://www.openstreetmap.org/?mlat=${lat.toFixed(6)}&mlon=${lon.toFixed(6)}#map=17/${lat.toFixed(6)}/${lon.toFixed(6)}`:'https://www.openstreetmap.org/'}

function runRemaining(z){return z.running&&Number.isFinite(Number(z.demoDeadlineMs))?Math.max(0,Number(z.demoDeadlineMs)-Date.now()):0}
function runProgress(z){if(!z.running||!z.demoStartedMs||!z.demoDeadlineMs)return 0;const total=Number(z.demoDeadlineMs)-Number(z.demoStartedMs);return total>0?Math.min(100,Math.max(0,(Date.now()-Number(z.demoStartedMs))/total*100)):0}

function reconcileRuns(){let changed=false;for(const si of state.sites||[])for(const z of si.zones||[]){

 if(Date.now()>=z.demoDeadlineMs){z.running=false;delete z.demoDeadlineMs;delete z.demoStartedMs;delete z.demoRunMinutes;if(z.status==='Watering')z.status='Needs water';
 si.events.unshift({time:new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}),text:`${z.name}: countdown finished; simulated watering automatically stopped`});changed=true;}

const WEEK_DAYS=[['Mon',1],['Tue',2],['Wed',3],['Thu',4],['Fri',5],['Sat',6],['Sun',0]];
function schedulesOf(si){if(!Array.isArray(si.manualSchedules))si.manualSchedules=[];return si.manualSchedules;}
function localDateString(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function scheduleDayNames(schedule){return schedule.repeat==='once'?(schedule.date||'One-time'):((schedule.days||[]).length===7?'Every day':WEEK_DAYS.filter(([_,d])=>schedule.days?.includes(d)).map(([label])=>label).join(', ')||'No days selected');}
function scheduledTimeForDay(d,time){const [hour,minute]=time.split(':').map(Number);const next=new Date(d);next.setHours(hour,minute,0,0);return next;}
function nextManualScheduleRun(sc,now=new Date()){
 if(!sc.enabled)return null;
 if(sc.repeat==='once'){
  if(sc.lastHandledKey)return null;
  const target=new Date(`${sc.date}T${sc.time}:00`);
  return Number.isFinite(target.getTime())&&target>=now?target:null;
 }
 const days=Array.isArray(sc.days)?sc.days:[];
 for(let offset=0;offset<8;offset++){
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+offset);
  if(!days.includes(d.getDay()))continue;
  const run=scheduledTimeForDay(d,sc.time);
  if(run<now)continue;
  if(sc.lastHandledKey===`${localDateString(run)}@${sc.time}`)continue;
  return run;
 }
 return null;
}
function scheduleNextLabel(sc){
 if(sc.repeat==='once'&&sc.lastHandledKey)return `Completed — ${sc.lastOutcome||'processed'}`;
 if(!sc.enabled)return 'Paused — will not start';
 const next=nextManualScheduleRun(sc);
 if(!next)return sc.repeat==='once'&&sc.lastHandledKey?`Finished: ${sc.lastOutcome||'Processed'}`:'No upcoming run';
 return `Next: ${next.toLocaleString('en-AU',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`;
}

function scheduleDueAction(si,sc,when){
 const zone=si.zones.find(z=>z.id===sc.zoneId);
 const at=new Date().toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'});
 let why='';
 if(!zone)why='zone no longer exists';
 else if(si.paused)why='whole site is paused';
 else if(zone.paused)why='zone is paused';
 else if(zone.softwareOnly)why='zone has no commissioned valve';
 else if(si.issues.some(i=>i.zoneId===zone.id&&i.status==='Open'&&i.severity==='Critical'))why='critical fault';
 else if(si.zones.some(z=>z.running))why='another run is already active';
 if(why){sc.lastOutcome='Skipped — '+why;si.events.unshift({time:at,text:`Schedule ${sc.name} skipped (${why})`});}
 else{
  const t=Date.now();zone.running=true;zone.status='Watering';zone.demoStartedMs=t;zone.demoDeadlineMs=t+sc.durationMin*60000;zone.demoRunMinutes=sc.durationMin;zone.demoScheduleId=sc.id;
  sc.lastOutcome=`Started at ${at}`;
  si.events.unshift({time:at,text:`Scheduled demo started: ${sc.name} · ${sc.durationMin} minutes`});
 }
 sc.lastHandledKey=`${localDateString(when)}@${sc.time}`;
 if(sc.repeat==='once')sc.enabled=false;
 return !why;
}
function processManualSchedules(){
 if(document.hidden)return false;
 let changed=false;const now=new Date();
 for(const si of state.sites||[])for(const sc of schedulesOf(si)){
  if(!sc.enabled||!si.zones?.length)continue;
  const target=sc.repeat==='once'?new Date(`${sc.date}T${sc.time}:00`):scheduledTimeForDay(now,sc.time);
  if(!Number.isFinite(target.getTime()))continue;
  if(sc.repeat==='weekly'&&!sc.days?.includes(now.getDay()))continue;
  const key=`${localDateString(target)}@${sc.time}`;
  if(sc.lastHandledKey===key)continue;
  const delay=now.getTime()-target.getTime();
  if(delay>=0&&delay<60000){scheduleDueAction(si,sc,target);changed=true;}
 }
 if(changed)save();
 return changed;
}

function generatedPlan(i){
 const t=`${i.title} ${i.evidence}`.toLowerCase();
 const z=zoneById(i.zoneId)?.name||'affected zone';
 if(/leak|high flow|burst/.test(t))return `1. Keep ${z} paused in the simulator to avoid more water loss.\n2. Find the linked flow meter or valve using Equipment Map.\n3. Check pipes, fittings and sprinklers for visible leaks.\n4. After repair, arrange a supervised flow test before any restart.`;
 if(/ph|acidity|alkaline/.test(t))return `1. Inspect the pH probe and check its last calibration.\n2. Confirm the reading using an appropriate soil sample or laboratory test.\n3. Discuss crop-specific pH adjustments with an agronomist.\n4. Record any treatment and monitor subsequent readings. Do not dose automatically.`;
 if(/moisture|dry|low flow|block/.test(t))return `1. Inspect the linked probe and its readings in ${z}.\n2. Check the water supply, drip emitters, filter and valve for uneven delivery.\n3. Compare recent weather with the watering schedule.\n4. Record the inspection before changing runtime.`;
 if(/offline|radio|battery|signal/.test(t))return `1. Check power, battery and radio connectivity at the saved installation point.\n2. Confirm gateway and controller status.\n3. Replace or repair the failed part if needed.\n4. Verify fresh readings after reconnecting.`;
 return `1. Review the recorded evidence and most recent readings.\n2. Find the linked device using Equipment Map.\n3. Perform a safe inspection and document the result.\n4. Request a qualified technician if the fault is not resolved.`;
}

 async function refreshWeather(){
 const s=site(),id=s.id;
 if(weeklyWeatherRequests.has(id))return;
 weeklyWeatherRequests.add(id);
 if(weeklyForecastOpen)render();
 try{
  if(!Number.isFinite(Number(s.lat))||!Number.isFinite(Number(s.lon)))throw new Error('Site coordinates not set');
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(s.lat)}&longitude=${encodeURIComponent(s.lon)}&current=temperature_2m,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max&timezone=auto&forecast_days=7`;
  const resp=await fetch(url,{cache:'no-store'});
  if(!resp.ok)throw new Error('Weather service unavailable');
  const data=await resp.json();
  const d=data.daily;
  const required=['time','weather_code','temperature_2m_max','temperature_2m_min','precipitation_probability_max','precipitation_sum','wind_speed_10m_max'];
  if(!d||!required.every(k=>Array.isArray(d[k])&&d[k].length>=7))throw new Error('Incomplete weekly forecast');
  const weekly=d.time.slice(0,7).map((date,i)=>({
   date,weatherCode:Number(d.weather_code[i]),high:Number(d.temperature_2m_max[i]),low:Number(d.temperature_2m_min[i]),
   rainProbability:Number(d.precipitation_probability_max[i]),rainMm:Number(d.precipitation_sum[i]),windMax:Number(d.wind_speed_10m_max[i])
  }));
  if(!weekly.every(day=>Object.values(day).every(v=>typeof v==='string'||Number.isFinite(v))))throw new Error('Incomplete weather measurements');
  const current=data.current||{};
  if(!Number.isFinite(Number(current.temperature_2m))||!Number.isFinite(Number(current.wind_speed_10m)))throw new Error('Current conditions unavailable');
  const target=state.sites.find(x=>x.id===id);if(!target)return;
  const [icon,condition]=weatherCodeDescription(current.weather_code);
  const updatedAt=new Date().toLocaleString('en-AU');
  target.weather={...target.weather,temp:Math.round(Number(current.temperature_2m)),wind:Math.round(Number(current.wind_speed_10m)),rain:Math.round(weekly[0].rainProbability),condition,weekly,weeklyStatus:'live',weeklyUpdated:updatedAt,updated:'Live · Open-Meteo · '+new Date().toLocaleTimeString()};
  save();
  weeklyWeatherRequests.delete(id);
  if(site().id===id)renderPreservingSearch();
  showToast('Seven-day forecast updated.');
 }catch(e){
  const target=state.sites.find(x=>x.id===id);
  if(target){target.weather={...target.weather,updated:'Demo current weather · live forecast unavailable',weeklyStatus:Array.isArray(target.weather?.weekly)&&target.weather.weekly.length>=7?'stale':'unavailable'};save();}
  weeklyWeatherRequests.delete(id);
  if(site().id===id)renderPreservingSearch();
  showToast('Live forecast unavailable. Please try again.');
 }
 }

  <h2>${esc(step.title)}</h2><p>${esc(step.text)}</p><div class="tour-note"><strong>Try it on the page</strong><div style="margin-top:7px">${esc(step.try)}</div></div>
  <div class="tour-mini" aria-hidden="true">${steps.map((_,idx)=>`<i class="${idx===tour.step?'current':idx<tour.step?'done':''}"></i>`).join('')}</div>
  <div class="tour-nav"><button class="button secondary" id="prevTour" ${tour.step===0?'disabled':''}>Back</button><button class="button primary" id="nextTour">${tour.step===steps.length-1?'Finish':'Next step →'}</button></div>
  <button type="button" class="button secondary" style="margin-top:12px;width:100%" id="skipTour">Exit tutorial</button>
  <p class="hint">This guide stays in its own area. Tap the app controls at any time.</p>
 </aside>`;}
 document.addEventListener('click',e=>{if(e.target.id==='nextTour') nextTour(); if(e.target.id==='prevTour') prevTour(); if(e.target.id==='skipTour'||e.target.id==='closeTour') closeTour(); if(e.target.id==='sidebar'&&state.mobileNav){state.mobileNav=false; render();}});
 window.addEventListener('storage',event=>{if(event.key===KEY){state=load();if(!state.sites.some(si=>si.plots.some(p=>p.id===selectedPlot)))selectedPlot='';render();showToast('Site data updated from another tab.');}});
 // Use CSS for layout; update viewport dimensions without rebuilding the app or
 // interrupting a map drag, text input, or real-time simulated run countdown.
 const docRoot=document.documentElement;
 let pendingViewportFrame=0;
 function measureAvailableViewport(){
  pendingViewportFrame=0;
  const vv=window.visualViewport;
  const width=Math.max(280,Math.round(vv?.width||window.innerWidth));
  const height=Math.max(200,Math.round(vv?.height||window.innerHeight));
  docRoot.style.setProperty('--live-viewport-h',`${height}px`);
  docRoot.style.setProperty('--live-viewport-w',`${width}px`);
  const layout=width<=520?'phone':width<=1100?'tablet':'desktop';
  docRoot.dataset.screenLayout=layout;
  docRoot.dataset.orientation=width>height?'landscape':'portrait';
  if(width>1100 && state.mobileNav){state.mobileNav=false;document.querySelector('#sidebar')?.classList.remove('open');document.querySelector('#navBackdrop')?.remove();}
  // No render() here: user input and the current countdown must be preserved.
 }
 function scheduleViewportMeasure(){if(!pendingViewportFrame)pendingViewportFrame=requestAnimationFrame(measureAvailableViewport)}
 window.addEventListener('resize',scheduleViewportMeasure,{passive:true});
 window.addEventListener('orientationchange',scheduleViewportMeasure,{passive:true});
 window.visualViewport?.addEventListener('resize',scheduleViewportMeasure,{passive:true});
 let mapResizeObserver=null;
 function watchVisibleMap(){
  mapResizeObserver?.disconnect();
  mapResizeObserver=new ResizeObserver(entries=>{
   if(!entries.length)return;
   const v=entries[0].target.getBoundingClientRect();
   const c=cameraFor();
   if(c.scale<=1){c.x=0;c.y=0;}else{
    const bx=(c.scale-1)*v.width/2+18,by=(c.scale-1)*v.height/2+18;
    c.x=Math.max(-bx,Math.min(bx,c.x));c.y=Math.max(-by,Math.min(by,c.y));
   }
   updateCamera();
  });
  const vp=document.querySelector('[data-map-viewport]');if(vp)mapResizeObserver.observe(vp);
 }
 // Original render logic is preserved; track newly rendered map nodes only.
 const originalSetupMapInteractions=setupMapInteractions;
 setupMapInteractions=function(){originalSetupMapInteractions();watchVisibleMap()};
 state.mobileNav=false;
 measureAvailableViewport();
 reconcileRuns();render();startWallClock(); if(navigator.onLine) refreshWeather();
})();
</script>
